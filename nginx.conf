# Configuração básica do NGINX otimizada para performance e segurança
# Servindo uma aplicação SPA (Single Page Application) com cache eficiente para assets estáticos

# Em caso de problema de formatação Windows (CRFL), use notepad++ ou similar para converter para LF (troque \r\n por \n)

worker_processes  auto;                     # Ajusta automaticamente ao numero de CPUs (worker é o processo nginx)
worker_rlimit_nofile 65535;                 # Limite de arquivos abertos por worker

error_log  /var/log/nginx/error.log warn;   # Log de erros
pid        /var/run/nginx.pid;              # Arquivo PID (process ID, usado para gerenciar o processo)

# Eventos (configurações relacionadas a conexões)
events {
  worker_connections  4096;                 # Numero maximo de conexões por worker
  multi_accept on;                          # Aceita multiplas conexões de uma vez
}

# Configurações HTTP (servidor web)
http {
  include       /etc/nginx/mime.types;      # Tipos MIME (Tipos de arquivos como .html, .css, .js)
  default_type  application/octet-stream;   # Tipo padrão se não reconhecido

  # Formato do log de acessos
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

  access_log  /var/log/nginx/access.log  main; # Log de acessos

  # Tuning de performance
  sendfile           on;                    # Usa sendfile para enviar arquivos (mais eficiente)
  tcp_nopush         on;                    # Otimiza envio de pacotes TCP (Protocólo de Controle de Transmissão)
  tcp_nodelay        on;                    # Desativa o algoritmo Nagle para reduzir latência
  keepalive_timeout  65;                    # Tempo de keep-alive (mantém conexões abertas para reutilização) em segundos
  types_hash_max_size 2048;                 # Tamanho máximo da tabela hash (tabelas hash são estruturas de dados para busca rápida) para tipos MIME
  server_tokens      off;                   # Remove a versão do nginx dos cabeçalhos de resposta (melhora segurança)

  # Cache de arquivos abertos (tuning)
  open_file_cache max=1000 inactive=60s;    # Cache de até 1000 arquivos por 60 segundos
  open_file_cache_valid 60s;                # Validade do cache
  open_file_cache_min_uses 2;               # Número mínimo de usos para manter no cache
  open_file_cache_errors on;                # Cache erros de arquivos

  # Limite de tamanho do corpo do cliente (upload)
  client_max_body_size 10M;

  # Limitação de taxa de requisições (rate limiting)
  # 10MB de memória é suficiente para cerca de 160000 endereços IP únicos
  limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;

  # Resolvedores DNS (usados para OCSP stapling e outros, ou seja, para melhorar performance e segurança de SSL)
  resolver 1.1.1.1 8.8.8.8 valid=300s;      # Cloudflare e Google DNS
  resolver_timeout 5s;                      # Timeout para consultas DNS

  # ---------- Compressão ----------
  gzip on;                                  # Ativa compressão gzip para respostas HTTP
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml; # Tipos MIME a serem comprimidos
  gzip_proxied any;                         # Comprime respostas para requisições proxy
  gzip_min_length 1000;                     # Comprimento mínimo para compressão
  gzip_buffers 16 8k;                       # Buffers para compressão (16 buffers de 8KB cada)
  gzip_comp_level 6;                        # Nível de compressão (1-9)
  gzip_vary on;                             # Adiciona cabeçalho Vary para proxies (melhora cache)
  gzip_disable "msie6";                     # Desativa gzip para IE6 (ou seja, navegadores muito antigos)

  # Opicional: Brotli (se tiver o módulo brotli no nginx)
  # brotli on;
  # brotli_comp_level 6;
  # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  # brotli_static on;

  # ---------- SSL / TLS (pra quando tiver) ----------
  # Nota: ajuste os caminhos dos certificados e chaves abaixo
#   ssl_protocols TLSv1.3 TLSv1.2;
#   ssl_prefer_server_ciphers off;
#   ssl_session_cache shared:SSL:10m;
#   ssl_session_timeout 1d;
#   ssl_session_tickets off;
#   ssl_stapling on;
#   ssl_stapling_verify on;

#   ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:'
#               'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:'
#               'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';

  include /etc/nginx/conf.d/*.conf;         # Inclui configurações adicionais de servidores
}