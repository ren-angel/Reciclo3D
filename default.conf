#  ---------- Servidor: HTTP -> Redireciona para HTTPS ----------
  # Para quando tiver SSL/TLS habilitado
#   server {
#     listen 80;
#     listen [::]:80;
#     server_name _;        # substitua pelo domínio ou mantenha "_" como curinga

#     return 301 https://$host$request_uri;
#   }

server {
    # Descomente as linhas abaixo para habilitar HTTPS
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # server_name _;

    listen 80;                              # Escuta na porta 80 (HTTP)
    listen [::]:80;                         # Escuta na porta 80 para IPv6
    # server_name _;                          # Substitua pelo domínio ou mantenha "_" como curinga
    server_name virteai.com.br www.virteai.com.br;

    # Substitua pelos caminhos dos seus certificados (Let's Encrypt ou certificados comerciais)
    # ssl_certificate /etc/ssl/certs/your_cert.crt;
    # ssl_certificate_key /etc/ssl/private/your_key.key;
    # (Optional) intermediate/chain if separate file:
    # ssl_trusted_certificate /etc/ssl/certs/your_chain.pem;

    # Segurança: OCSP Stapling para melhorar performance e segurança de SSL
    # ssl_stapling on; (already globally set)
    # ssl_stapling_verify on;

    # Raiz do documento e arquivo index
    root /usr/share/nginx/html;
    index index.html;

    # Use tamanhos de buffer menores para requisições do cliente (se buffers grandes não forem necessários)
    client_body_buffer_size 16K;            # Buffer para corpo da requisição
    client_header_buffer_size 1k;           # Buffer para cabeçalho da requisição
    large_client_header_buffers 4 4k;       # Buffers grandes para cabeçalhos grandes

    # Aplicar limitação de taxa de requisições
    limit_req zone=one burst=20 nodelay;

    # ---------- Cabeçalhos de segurança (definidos para todas as respostas) ----------
    # Use 'always' para garantir que os cabeçalhos sejam adicionados mesmo em respostas de erro
    add_header Referrer-Policy "no-referrer-when-downgrade" always;     # Política de Referência
    add_header X-Content-Type-Options "nosniff" always;                 # Evita "MIME sniffing" (detecção de tipo MIME)
    add_header X-Frame-Options "SAMEORIGIN" always;                     # Protege contra clickjacking (clipes maliciosos)
    add_header X-XSS-Protection "1; mode=block" always;                 # Proteção contra XSS (Cross-Site Scripting, ataques de script)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always; # HSTS (apenas se HTTPS estiver habilitado)
    # add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always; # Política de permissões (desativa APIs desnecessárias)
    add_header X-Download-Options "noopen" always;                      # Protege contra downloads maliciosos no Internet Explorer
    add_header X-Permitted-Cross-Domain-Policies "none" always;         # Restringe políticas cross-domain (Flash, Acrobat)
    add_header Server " " always;                                       # Remove o cabeçalho Server para segurança

    # Content-Security-Policy (CSP)
    # Isto é uma política de exemplo para um SPA típico servido da mesma origem.
    # DEVE ser adaptado ao aplicativo (scripts de terceiros, analytics, CDNs, fontes).
    # add_header Content-Security-Policy "
    #   default-src 'self';
    #   script-src 'self' 'unsafe-inline' 'unsafe-eval' https:;
    #   connect-src 'self' https:;
    #   img-src 'self' data: https:;
    #   style-src 'self' 'unsafe-inline' https:;
    #   font-src 'self' https:;
    #   frame-ancestors 'none';
    #   base-uri 'self';
    # " always;

    # Políticas cross-origin (úteis para recursos baseados em COOP/COEP)
    # Ative apenas se entender as implicações (pode quebrar incorporação cross-origin)
    # add_header Cross-Origin-Opener-Policy "same-origin" always;
    # add_header Cross-Origin-Embedder-Policy "unsafe-none" always;

    # ---------- Recursos estáticos ----------
    # Arquivos de impressão digital, CSS, JS, fontes, imagens — cache longo e imutável
    location ~* \.(?:js|css|woff2|woff|ttf|eot|otf|png|jpg|jpeg|svg|gif|ico|webp|avif)$ {
        try_files $uri =404;                                                   # Retorna 404 se o arquivo não for encontrado
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always; # Cache longo (1 ano) e imutável
        add_header X-Content-Type-Options "nosniff" always;                    # Evita "MIME sniffing"

        # CORS para fontes (se usadas em domínios cruzados)
        # Ative se tiver fontes (TTF, OTF, WOFF, WOFF2) sendo carregadas de outros domínios
    #   if ($request_uri ~* \.(?:ttf|otf|woff|woff2)$) {
    #     add_header Access-Control-Allow-Origin "*" always;
    #   }

        # Ativa ETag para validação eficiente de cache
        expires 1y;
        etag on;
    }

    # Páginas HTML (index.html) — não faça cache pesado; permita revalidação
    location = /index.html {
        try_files /index.html =404;      # Retorna 404 se o arquivo não for encontrado
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
    }

    # Service Worker (Responsavel por cache e funcionalidades offline) — não faça cache pesado; permita revalidação
    location = /service-worker.js {
        try_files $uri =404;             # Retorna 404 se o arquivo não for encontrado
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
    }

    # Raiz e SPA fallback para index.html (preserve URLs limpas)
    location / {
        try_files $uri $uri/ /index.html;             # Tenta servir o arquivo ou diretório, senão serve index.html
        add_header Cache-Control "no-cache" always;
        # Desabilita logs de acesso para reduzir ruído:
        # access_log off;
    }

    # Negar acesso a arquivos ocultos (começando com .)
    location ~ (^|/)\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Negar acesso a arquivos sensíveis como .git, composer.json, README, LICENSE
    location ~* (^/\.git|/composer\.(json|lock)|/README|/LICENSE) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Erros personalizados
    error_page 404 /index.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Checagem de saúde simples
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}